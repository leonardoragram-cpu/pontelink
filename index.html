<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PONTELINKS</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#060606;display:flex;justify-content:center;font-family:sans-serif}
.page{width:100%;max-width:430px;min-height:100vh;background:#050505;padding:18px}
.header{display:flex;align-items:center;justify-content:center;gap:12px;padding-top:8px}
.header img{width:56px;height:56px}
.header h1{font-family:"Times New Roman",serif;font-size:22px;letter-spacing:3px;color:#c9b896;font-weight:400}
.saiba-top{display:flex;justify-content:center;margin-top:12px}
.saiba-top a{border:1px solid #c9b896;color:#c9b896;border-radius:20px;padding:6px 16px;font-size:13px;font-weight:700;text-decoration:none}
.title{margin-top:22px;text-align:center;color:#fff;font-family:"Times New Roman",serif;font-size:30px;line-height:1.15}
.input-wrap{margin-top:26px;position:relative}
.input-wrap input{width:100%;height:58px;border-radius:30px;border:none;background:#f0f0f0;padding:0 20px 0 52px;font-size:17px;outline:none}
.input-wrap::before{content:"🔗";position:absolute;left:20px;top:50%;transform:translateY(-50%);font-size:20px}
.btn-gerar{margin-top:18px;width:100%;height:54px;border-radius:28px;background:#060606;border:1.6px solid #c9b896;color:#c9b896;font-size:17px;font-weight:800;cursor:pointer}
.box-gold{margin-top:20px;background:linear-gradient(180deg,#d6c48a 0%,#b89a4a 100%);border:1.8px dashed #7a642a;border-radius:22px;padding:22px 14px;text-align:center}
.box-gold h2{color:#2a1e00;font-size:18px;font-weight:900;word-break:break-all}
.box-actions{margin-top:14px;display:flex;gap:10px;justify-content:center}
.btn-mini{background:#111;color:#fff;border:1px solid #333;border-radius:20px;padding:7px 16px;font-size:13px;font-weight:700;cursor:pointer}
.box-white{margin-top:20px;background:#e8e8e8;border-radius:20px;padding:18px;color:#222;text-align:center}
.btn{width:100%;height:54px;border-radius:28px;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:12px;cursor:pointer}
.btn-white{background:#fff;border:none;color:#222}
.btn-black{background:#000;border:1.5px solid #c9b896;color:#c9b896;margin-top:14px}
</style>
</head>
<body>
<div class="page">
  <div class="header">
    <img src="img/logo.png" alt="PONTELINKS">
    <h1>PONTELINKS</h1>
  </div>
  <div class="saiba-top"><a href="saiba-tudo-sobre.html">✨ Saiba tudo a respeito</a></div>
  <div class="title">Pontifique seu link para o<br>mundo todo</div>
  <div class="input-wrap"><input id="linkInput" placeholder="Cole seu link aqui"></div>
  <button class="btn-gerar" onclick="gerar()">✨ GERAR PONTELINKS</button>
  <div class="box-gold">
    <h2 id="resultText">SEU LINK PONTIFICADO VAI APARECER AQUI</h2>
    <div class="box-actions">
      <button class="btn-mini" onclick="copiar()">📋 COPIAR</button>
      <button class="btn-mini" onclick="abrirPrevia()">📄 PRÉVIA</button>
    </div>
  </div>
  <div class="box-white">Mesmo que a sua hospedagem seja sempre gratuita, considere fazer uma contribuição mensal, se estiver ao seu alcance.</div>
  <button class="btn btn-white">💛 Contribuir via Pix</button>
  <button class="btn btn-black">📥 Baixar Aplicativo</button>
</div>
<script>
let finalLink="";
function gerar(){
  let v=document.getElementById('linkInput').value.trim();
  if(!v){alert('Cole seu link');return}
  if(!v.startsWith('http')) v='https://'+v;
  const id=Math.random().toString(36).substring(2,8);
  finalLink='https://pontelinks.com.br/p/'+id;
  document.getElementById('resultText').innerText=finalLink;
}
function copiar(){
  if(!finalLink){alert('Gere primeiro');return}
  navigator.clipboard.writeText(finalLink);
}
function abrirPrevia(){
  if(!finalLink){alert('Gere primeiro');return}
  alert('PRÉVIA:\\n\\n'+finalLink+'\\n\\n📊 Repercussão desta ponte:\\n👁️ 127 visualizações\\n🖱️ 83 cliques\\n📍 De onde veio: Facebook, X, Direto/WhatsApp');
}
</script>
</body>
</html>
