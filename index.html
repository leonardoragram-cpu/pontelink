<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PONTE LINKS - pontelinks.com</title>
<link rel="icon" href="img/icon-512.png">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background:#080808;
    color:#fff;
    font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:40px 20px;
  }
  .container{width:100%;max-width:480px;display:flex;flex-direction:column;align-items:center}
  .logo-box{
    width:72px;height:72px;
    background:#fff;
    border-radius:20px;
    display:flex;align-items:center;justify-content:center;
    padding:8px;
    margin-bottom:20px;
    box-shadow:0 4px 20px rgba(255,255,255,0.08);
  }
  .logo-box img{width:100%;height:100%;object-fit:contain;border-radius:12px}
  h1{font-size:28px;font-weight:800;letter-spacing:0.18em;line-height:1;margin-bottom:8px}
  .subtitle{font-size:14px;color:#888;letter-spacing:0.05em;margin-bottom:32px}
  .card{
    width:100%;
    background:#fff;
    border-radius:20px;
    padding:20px;
    margin-bottom:28px;
  }
  .card-row{display:flex;gap:10px}
  .card-row input{
    flex:1;background:#f2f2f2;border:1px solid #e5e5e5;border-radius:12px;
    padding:14px 16px;font-size:14px;outline:none;color:#111;
  }
  .card-row input::placeholder{color:#999}
  .card-row input:focus{border-color:#111}
  .btn-criar{
    background:#080808;color:#fff;border:none;border-radius:12px;
    padding:0 24px;font-weight:700;font-size:14px;cursor:pointer;transition:0.2s;
  }
  .btn-criar:hover{background:#1a1a1a}
  #resultado{
    margin-top:16px;display:none;background:#f2f2f2;border-radius:12px;
    padding:12px;align-items:center;justify-content:space-between;gap:10px;
  }
  #resultado.show{display:flex}
  #linkGerado{flex:1;background:transparent;border:none;font-size:14px;font-weight:600;color:#111;outline:none}
  .btn-copiar{background:#080808;color:#fff;border:none;border-radius:8px;padding:8px 14px;font-size:12px;font-weight:700;cursor:pointer}
  .links{width:100%;display:flex;flex-direction:column;gap:12px}
  .link-btn{
    width:100%;background:#1A1A1A;border:1px solid #2A2A2A;border-radius:12px;
    padding:16px 20px;color:#fff;text-decoration:none;display:flex;
    flex-direction:column;align-items:center;gap:2px;transition:0.2s;cursor:pointer;
  }
  .link-btn:hover{background:#222;border-color:#333;transform:translateY(-1px)}
  .link-btn strong{font-size:15px}
  .link-btn span{font-size:12px;color:#888}
  footer{margin-top:32px;color:#444;font-size:11px}
</style>
</head>
<body>
  <div class="container">
    <div class="logo-box">
      <img src="img/icon-512.png" alt="Ponte Links Logo">
    </div>
    <h1>PONTE LINKS</h1>
    <div class="subtitle">pontelinks.com</div>

    <div class="card">
      <div class="card-row">
        <input type="text" id="inputLink" placeholder="cole seu link longo aqui...">
        <button class="btn-criar" onclick="criar()">Criar</button>
      </div>
      <div id="resultado">
        <input type="text" id="linkGerado" readonly>
        <button class="btn-copiar" onclick="copiar()">Copiar Link</button>
      </div>
    </div>

    <div class="links">
      <a class="link-btn" href="https://instagram.com" target="_blank">
        <strong>Instagram</strong><span>@pontelinks</span>
      </a>
      <a class="link-btn" href="https://wa.me/" target="_blank">
        <strong>WhatsApp</strong><span>Fale conosco</span>
      </a>
      <a class="link-btn" href="https://pontelinks.com" target="_blank">
        <strong>Site Oficial</strong><span>pontelinks.com</span>
      </a>
    </div>
    <footer>© 2026 Ponte Links</footer>
  </div>

<script>
function criar(){
  const input = document.getElementById('inputLink');
  const valor = input.value.trim();
  if(!valor){
    input.focus();
    input.style.borderColor = '#ff4444';
    setTimeout(()=> input.style.borderColor = '#e5e5e5', 1500);
    return;
  }
  const chars = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
  let slug = '';
  for(let i=0;i<6;i++){
    slug += chars.charAt(Math.floor(Math.random()*chars.length));
  }
  const linkCurto = 'pontelinks.com/' + slug;
  document.getElementById('linkGerado').value = linkCurto;
  document.getElementById('resultado').classList.add('show');
}

function copiar(){
  const el = document.getElementById('linkGerado');
  el.select();
  el.setSelectionRange(0, 99999);
  navigator.clipboard.writeText(el.value).then(()=>{
    const btn = document.querySelector('.btn-copiar');
    const original = btn.textContent;
    btn.textContent = 'Copiado!';
    btn.style.background = '#16a34a';
    setTimeout(()=>{
      btn.textContent = original;
      btn.style.background = '#080808';
    }, 2000);
  }).catch(()=>{
    document.execCommand('copy');
    alert('Link copiado: ' + el.value);
  });
}

document.getElementById('inputLink').addEventListener('keypress', function(e){
  if(e.key === 'Enter'){ criar(); }
});
</script>
</body>
</html
