<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PonteLinks - Em Manutenção</title>
<style>
  body{background:#000;color:#fff;font-family:sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;flex-direction:column;text-align:center;margin:0;padding:20px}
  .box{border:1px solid #222;border-radius:16px;padding:40px 30px;max-width:480px;background:#0a0a0a}
  img{width:120px;border-radius:16px;margin-bottom:20px}
  h1{color:#e8c05a;margin:10px 0;font-size:28px}
  p{color:#aaa;line-height:1.6;margin:10px 0}
  .badge{display:inline-block;margin-top:20px;padding:10px 18px;border:1px solid #e8c05a;color:#e8c05a;border-radius:999px;font-size:14px;letter-spacing:1px}
</style>
</head>
<body>
  <div class="box">
    <img src="https://pontelinks.com.br/arvore.png" alt="PonteLinks">
    <h1>PonteLinks</h1>
    <p>Estamos em manutenção para melhorar sua experiência.</p>
    <p>Nossos links inteligentes voltarão amanhã com a capa grande funcionando para YouTube, Instagram e Facebook.</p>
    <span class="badge">VOLTAMOS EM BREVE</span>
    <p style="margin-top:30px;font-size:12px;color:#555">pontelinks.com.br</p>
  </div>
</body>
</html>
