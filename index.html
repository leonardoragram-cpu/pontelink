<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PONTELINKS</title>
<meta property="og:title" content="PONTELINKS - via Leonardo">
<meta property="og:description" content="Ponte entre mídias. Cole de YouTube, TikTok, Instagram, Facebook, X e compartilhe em qualquer rede.">
<meta property="og:url" content="https://pontelinks.com">
<meta property="og:image" content="https://pontelinks.com/og.png">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="https://pontelinks.com/favicon.ico">
<style>
 body{background:#f6f6f5;color:#111;font-family:Inter,system-ui;padding:20px;display:flex;justify-content:center}
 .card{max-width:480px;width:100%;background:#fff;border-radius:24px;padding:24px;box-shadow:0 10px 30px rgba(0,0,0,.08)}
 h1{font-weight:900;letter-spacing:-1px;margin:0} h1 span{color:#888;font-weight:400;font-size:14px}
 input{width:100%;padding:16px;border-radius:12px;border:1.5px solid #ddd;margin-top:16px;font-size:16px}
 button{width:100%;padding:16px;border-radius:12px;border:0;background:#111;color:#fff;font-weight:700;margin-top:12px;font-size:16px;cursor:pointer}
 .platforms{margin-top:12px;color:#666;font-size:12px}
</style>
</head>
<body>
<div class="card">
<h1>PONTELINKS <span>via Leonardo</span></h1>
<p style="color:#666;margin:8px 0 0 0">Crie pontes clicáveis entre todas as redes.</p>
<input id="url" placeholder="Cole link YouTube, TikTok, Instagram, Facebook, X, etc">
<button onclick="gerar()">GERAR PONTE</button>
<div class="platforms">Funciona: YouTube ✓ TikTok ✓ Instagram ✓ Facebook ✓ X ✓ Kwai ✓ Todos como ponte clicável garantida</div>
<div id="result" style="margin-top:20px;word-break:break-all"></div>
</div>
<script>
function gerar(){
  const v=document.getElementById('url').value.trim();
  if(!v){alert('Cole um link');return}
  // Gera ID da ponte - aqui você liga com seu Worker depois
  const id=Math.random().toString(36).substring(2,8);
  const ponte=`https://pontelinks.com/p/${id}`;
  const origem = v.includes('instagram') ? 'Instagram' : v.includes('facebook') || v.includes('fb.watch') ? 'Facebook' : v.includes('tiktok') ? 'TikTok' : 'Origem';
  document.getElementById('result').innerHTML = `
    <div style="background:#f6f6f5;padding:16px;border-radius:12px">
      <b style="color:green">✓ PONTE CRIADA COM SUCESSO</b><br><br>
      <small>Origem: ${origem}</small><br>
      <a href="${ponte}" target="_blank" style="font-size:18px;font-weight:700;color:#111">${ponte}</a><br><br>
      <small>Essa ponte é 100% clicável no X, WhatsApp, Telegram, etc. Se a origem bloquear mídia (Instagram/Facebook), mostramos capa PONTELINKS + botão Abrir na Origem.</small><br><br>
      <button onclick="navigator.clipboard.writeText('${ponte}')" style="background:#fff;color:#111;border:1.5px solid #111">COPIAR PONTE</button>
      <br><br>
      <a href="${v}" target="_blank" style="display:block;text-align:center;background:#eee;padding:12px;border-radius:8px;text-decoration:none;color:#111">Abrir na ${origem} ↗</a>
    </div>
  `;
}
</script>
</body>
</html>
