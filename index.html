<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pontelinks</title>
    <style>
        body { font-family: sans-serif; background-color: #000; color: #fff; text-align: center; margin: 0; padding: 20px; }
        .nav-buttons { display: flex; justify-content: space-between; margin-bottom: 20px; }
        .nav-buttons a { color: #d4af37; text-decoration: none; font-size: 14px; }
        .hero-img { max-width: 80%; height: auto; margin: 20px 0; }
        .main-text { font-size: 24px; margin-bottom: 20px; }
        input[type="text"] { width: 100%; padding: 15px; margin-bottom: 20px; border-radius: 5px; border: 1px solid #d4af37; background-color: #111; color: #fff; box-sizing: border-box; }
        .action-button { width: 100%; padding: 15px; background-color: #d4af37; color: #000; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; margin-bottom: 20px; }
        .result-box { display: flex; justify-content: space-between; align-items: center; padding: 10px; border: 1px dashed #d4af37; border-radius: 5px; margin-bottom: 20px; }
        .copy-button { background-color: #d4af37; border: none; padding: 10px; border-radius: 5px; cursor: pointer; color: #000; }
        .secondary-button { width: 100%; padding: 15px; background-color: #fff; color: #000; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="nav-buttons">
        <a href="#">Baixar Aplicativo</a>
        <a href="#">Saiba tudo sobre</a>
    </div>

    <img src="arvore.jpg" alt="Pontelinks Tree" class="hero-img">

    <div class="main-text">Pontifique seu link para o mundo todo</div>

    <input type="text" placeholder="Cole seu link aqui...">

    <button class="action-button">GERAR PONTE LINKS</button>

    <div class="result-box">
        <span>pontelinks.com.br/p/ab3x9</span>
        <button class="copy-button">Copiar</button>
    </div>

    <button class="secondary-button">VER PRÉVIA</button>
    <button class="secondary-button">Contribuir via Pix</button>
    <button class="secondary-button">Contribuir via Inter - Dólar USA</button>
    <button class="secondary-button">Contribuir via Inter - Euro</button>

    <footer>
        <p>Cloudflare</p>
    </footer>
</body>
</html>
