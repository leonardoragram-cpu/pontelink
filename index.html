<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ponte Links • pontelinks.com</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2563eb">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#f5f5ef;font-family:Arial,sans-serif;min-height:100vh}
body::before{
content:'';
position:fixed;inset:0;
background-image:url('./img/arvore.png');
background-repeat:repeat-y;
background-position:center 70px;
background-size:94% auto;
opacity:0.40;
pointer-events:none;
z-index:0;
}
.page{max-width:680px;margin:0 auto;background:rgba(255,255,255,0.88);min-height:100vh;position:relative;z-index:1}
.topo{background:#0e0e0e;color:#d4af37;padding:14px;text-align:center;font-weight:900}
.hero{padding:28px 18px;text-align:center}
.box{margin:20px;background:#fff;border:2px solid #16a34a;border-radius:14px;padding:16px}
input{width:100%;padding:14px;border:2px solid #ccc;border-radius:10px;font-size:16px}
.btn{width:100%;margin-top:12px;padding:14px;border:0;border-radius:10px;font-weight:900;font-size:17px;cursor:pointer}
.btn-pont{background:#16a34a;color:#fff}
.btn-app{background:#111;color:#d4af37}
.btn-pix{background:#d4af37;color:#111}
.result{margin-top:14px;padding:12px;background:#dcfce7;border:2px solid #16a34a;border-radius:10px;display:none}
</style>
</head>
<body>
<div class="page">
<div class="topo">PONTE LINKS • pontelinks.com</div>
<div class="hero">
<h1>Pontifique seu link</h1>
<div class="box">
<input id="url" placeholder="Cole seu link aqui">
<button class="btn btn-pont" onclick="pontificar()">Pontificar link</button>
<button class="btn btn-app" id="btnInstalar">📲 BAIXAR APLICATIVO</button>
<button class="btn btn-pix" onclick="copiarPix()">💰 CONTRIBUIÇÃO / PIX</button>
<div id="res" class="result"></div>
</div>
</div>
</div>
<script>
let deferredPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e});
document.getElementById('btnInstalar').addEventListener('click',async()=>{
 if(deferredPrompt){deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null}
 else{alert('No Chrome: 3 pontinhos > Instalar app')}
});
function pontificar(){
 const v=document.getElementById('url').value.trim();
 if(!v)return alert('Cole um link');
 const slug=v.split('/').pop().substring(0,14).replace(/[^a-zA-Z0-9]/g,'')||'meulink';
 document.getElementById('res').style.display='block';
 document.getElementById('res').innerHTML=`<b>pontelinks.com/${slug}</b><br><br><button onclick="navigator.clipboard.writeText('https://www.pontelinks.com/${slug}');alert('Copiado!')" style="padding:10px;background:#16a34a;color:#fff;border:0;border-radius:8px;font-weight:900">📋 COPIAR</button>`;
}
function copiarPix(){
 const chave='SEU-PIX-AQUI';
 navigator.clipboard.writeText(chave);
 alert('Pix copiado: '+chave);
}
</script>
</body>
</html>
