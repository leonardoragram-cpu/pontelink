<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Pontelinks</title>
<style>body{font-family:sans-serif;background:#000;color:#fff;text-align:center;margin:0;padding:20px}.nav{display:flex;justify-content:space-between;margin-bottom:20px}.nav a{color:#d4af37;text-decoration:none;font-size:14px;cursor:pointer}img{max-width:85%;margin:15px 0;border-radius:12px}input{width:100%;padding:15px;border-radius:8px;border:1px solid #d4af37;background:#111;color:#fff;box-sizing:border-box;margin-bottom:10px}.btn{width:100%;padding:15px;border-radius:8px;border:none;font-weight:bold;cursor:pointer;margin-bottom:10px}.gold{background:#d4af37;color:#000}.white{background:#fff;color:#000}#res{display:none;padding:12px;border:1px dashed #d4af37;border-radius:8px;background:#111;margin-bottom:10px;word-break:break-all}#previa{display:none;background:#111;border:1px solid #333;border-radius:12px;padding:15px;margin-top:10px;text-align:left}</style></head><body>
<div class=nav><a onclick="alert('App em breve! Por enquanto use o site e salve na tela inicial.')">Baixar Aplicativo</a><a onclick="alert('PonteLinks cria links pontelinks.com/p/xxxxx com previa segura. Voce cola o link, gera, e quem receber ve pra onde vai antes de clicar. Protege de golpe. Pix: 67.531.029/0001-70')">Saiba tudo sobre</a></div>
<img src="arvore.jpg"><div style="font-size:22px;margin-bottom:15px">Pontifique seu link para o mundo todo</div>
<input id="u" placeholder="Cole seu link aqui https://...">
<button class="btn gold" onclick="G()">GERAR PONTE LINKS</button>
<div id="res"><span id="s"></span><br><br><button class="btn gold" style="width:auto;padding:8px 20px" onclick="C()">Copiar</button></div>
<button class="btn white" onclick="P()">VER PREVIA</button>
<button class="btn white" onclick="navigator.clipboard.writeText('67.531.029/0001-70');alert('PIX Brasil copiado! 67.531.029/0001-70')">Contribuir via Pix</button>
<button class="btn white" onclick="alert('Inter Dolar/Euro - Use PIX CNPJ: 67.531.029/0001-70 - Titular Leonard R Gram - Funciona para quem esta fora do Brasil via Pix internacional')">Contribuir via Inter - Dolar / Euro</button>
<div id="previa"></div>
<footer style="margin-top:20px;font-size:11px;color:#666">Cloudflare - Pix 67.531.029/0001-70</footer>
<script>
let ID='',URL='';
function G(){let v=document.getElementById('u').value.trim();if(!v.startsWith('http')){alert('Cole com https://');return}URL=v;ID=btoa(v).replace(/\+/g,'-').replace(/\//g,'_').replace(/=/g,'').slice(0,18);let short=location.origin+'/p/'+ID;document.getElementById('s').innerText=short;document.getElementById('res').style.display='block';navigator.clipboard.writeText(short);let db=JSON.parse(localStorage.getItem('pl')||'{}');db[ID]=v;localStorage.setItem('pl',JSON.stringify(db));alert('Link gerado e COPIADO: '+short)}
function C(){navigator.clipboard.writeText(document.getElementById('s').innerText);alert('Copiado!')}
function P(){if(!ID){alert('Gere primeiro');return}let c=localStorage.getItem('c_'+ID)||0;document.getElementById('previa').style.display='block';document.getElementById('previa').innerHTML='<b>PREVIA SEGURA</b><br><br>Destino: <b style=color:#d4af37;word-break:break-all>'+URL+'</b><br><br>Cliques aqui: '+c+'<br>Veio de: '+(document.referrer||'pontelinks.com')+'<br><br><a href=\''+URL+'\' target=_blank><button class=btn gold>IR PARA DESTINO</button></a>';window.scrollTo(0,9999)}
</script></body></html>
