<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PonteLinks</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Inter,system-ui,sans-serif}
body{background:#000;color:#fff;display:flex;justify-content:center}
.wrap{width:100%;max-width:480px;background:#000;min-height:100vh;padding:14px 14px 0;display:flex;flex-direction:column}
.flags{display:flex;justify-content:center;gap:14px;padding:10px 0}
.flags button{font-size:28px;background:#111;border:1px solid #333;border-radius:10px;width:56px;height:42px;cursor:pointer}
.logo{text-align:center;padding:6px 0 10px}
.logo img{width:180px;height:180px;object-fit:contain;display:block;margin:0 auto}
h1{text-align:center;font-size:42px;font-weight:300;line-height:1}
.gold{color:#e8c05a}.silver{color:#c0c0c0}
.sub{text-align:center;color:#ccc;font-size:14px;margin:8px 0 18px}
.field input{width:100%;height:54px;background:#0f0f12;border:1px solid #d4a01766;border-radius:12px;padding:0 14px;color:#fff;font-size:16px;outline:none}
.btn-gold{width:100%;height:54px;margin-top:10px;border:none;border-radius:12px;background:linear-gradient(180deg,#fde68a,#d4a017);color:#000;font-weight:900;cursor:pointer;font-size:15px}
.label{text-align:center;font-size:10px;color:#aaa;margin:18px 0 10px;letter-spacing:.8px}
.result{min-height:56px;background:#0a0a0a;border:1px dashed #333;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#666;font-weight:700;padding:8px;word-break:break-all;text-align:center}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.btn{height:52px;border-radius:12px;border:1px solid #555;background:#111;color:#fff;font-weight:700;font-size:12px;cursor:pointer}
.btn.gold{border-color:#5a4a1a;color:#e8c05a}
.apoie{text-align:center;color:#e8c05a;font-weight:800;margin:18px 0 10px;font-size:13px}
.donate{display:flex;flex-direction:column;gap:8px;align-items:center}
.donate button{width:300px;height:46px;border-radius:10px;background:#111;border:1px solid #5a4a1a;color:#e8c05a;font-weight:700;font-size:12px;cursor:pointer}
.footer{margin-top:auto;border-top:1px solid #111;padding:14px 6px;text-align:center;font-size:11px;color:#888;line-height:1.4}
.qr{width:64px;height:64px;background:#fff;padding:3px;border-radius:6px;margin:8px auto 0;display:block}
.modal{position:fixed;inset:0;background:#000000f0;display:none;align-items:flex-start;justify-content:center;z-index:99;padding:16px;overflow:auto}
.modal.open{display:flex}
.box{background:#111;border:1px solid #d4a01755;border-radius:16px;max-width:520px;width:100%;padding:20px;margin:auto}
.box h2{color:#e8c05a;font-size:20px;margin-bottom:12px;text-align:center}
.box h3{color:#fff;font-size:14px;margin:14px 0 6px}
.box p{font-size:13px;color:#ccc;line-height:1.6;margin-bottom:10px}
.box img.thumb{width:100%;border-radius:12px;margin:10px 0;border:1px solid #333}
.close{width:100%;height:46px;margin-top:10px;border:none;border-radius:10px;background:#222
