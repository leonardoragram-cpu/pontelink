<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ponte Links - Em Manutenção</title>
<style>
  body {
    margin: 0;
    background: #0a1931;
    color: #ffffff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    text-align: center;
  }
  .container {
    max-width: 500px;
    padding: 40px 20px;
  }
  .logo {
    font-size: 32px;
    font-weight: bold;
    margin-bottom: 10px;
    color: #d4af37;
  }
  .logo span {
    font-size: 40px;
  }
  h1 {
    font-size: 22px;
    margin: 20px 0 10px;
    color: #ffffff;
  }
  p {
    color: #a0aec0;
    font-size: 16px;
    line-height: 1.5;
  }
  .box {
    margin-top: 30px;
    border: 1px solid #1a2a4a;
    border-radius: 12px;
    padding: 20px;
    background: #0f2040;
  }
</style>
</head>
<body>
  <div class="container">
    <div class="logo"><span>🌉</span><br>Ponte Links</div>
    <div class="box">
      <h1>Estamos em manutenção</h1>
      <p>Estamos preparando a nova versão para lançar bonitão, como tem que ser.<br><br>Volte em breve.</p>
    </div>
  </div>
</body>
</html>
