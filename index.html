<style>
/* TRAVA SELEÇÃO E ARRASTAR */
* {
  -webkit-user-select: none;
  -moz-user-select: none;
  -ms-user-select: none;
  user-select: none;
  -webkit-user-drag: none;
}
input, textarea {
  -webkit-user-select: text;
  user-select: text;
}
</style>
<script>
// TRAVA BOTÃO DIREITO
document.addEventListener('contextmenu', e => e.preventDefault());

// TRAVA CTRL+C, CTRL+U, CTRL+P, F12
document.addEventListener('keydown', e => {
  if (e.ctrlKey && ['c','u','p','s'].includes(e.key.toLowerCase())) {
    e.preventDefault();
    alert('© Ponte Links ® - Conteúdo protegido');
  }
  if (e.key === 'PrintScreen' || e.keyCode === 44) {
    e.preventDefault();
    document.body.style.filter = 'blur(20px)';
    setTimeout(()=> document.body.style.filter='none', 2000);
    alert('© Ponte Links ® - Print bloqueado');
  }
  if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && e.key === 'I')) {
    e.preventDefault();
  }
});

// TRAVA ARRASTAR IMAGEM
document.addEventListener('dragstart', e => e.preventDefault());
</script>
