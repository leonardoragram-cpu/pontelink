<style>
 body{background:#0a0a0a;color:#fff;font-family:Inter,system-ui;padding:20px;display:flex;justify-content:center}
 .card{max-width:520px;width:100%;background:#111;border:1px solid #222;border-radius:24px;padding:24px}
 h1{font-weight:900;letter-spacing:-1px;margin:0;font-size:32px} h1 span{color:#888;font-weight:400;font-size:14px}
 input{width:100%;padding:16px;border-radius:12px;border:1.5px solid #333;background:#000;color:#fff;margin-top:16px;font-size:16px}

<body>
<div class="card">
<h1>PONTELINKS <span>via Leonardo - com S</span></h1>

<input id="url" placeholder="Cole YouTube, TikTok, Instagram, Facebook, X...">
<button onclick="gerar()">GERAR PONTE</button>
<div class="tag">PONTELINKS.com com S: Funciona YouTube ✓ TikTok ✓ Instagram ✓ Facebook ✓ X ✓ Kwai ✓<br>Todos com ponte clicável garantida. Diferente de pontlink.com.br</div>
<div id="result" style="margin-top:20px;word-break:break-all"></div>
</div>
<script>
function gerar(){
  const v=document.getElementById('url').value.trim();
  if(!v){alert('Cole um link');return}
  const id=Math.random().toString(36).substring(2,8);
  const ponte=`https://pontelinks.com/p/${id}`;
  document.getElementById('result').innerHTML=`<div style="background:#1a1a1a;padding:16px;border-radius:12px"><b style="color:#0f0">✓ PONTE CRIADA</b><br><br><a href="${ponte}" style="font-size:18px;font-weight:700;color:#fff">${ponte}</a><br><br><button onclick="navigator.clipboard.writeText('${ponte}')" style="background:#000;color:#fff;border:1px solid #333">COPIAR</button></div>`;
}
</script>
