<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PONTELINKS - Ponte Clicável Universal</title>
<link rel="canonical" href="https://pontelinks.com/">
<meta name="description" content="PONTELINKS: Crie pontes clicáveis que funcionam no X, WhatsApp, Telegram. Cole YouTube, TikTok, Instagram, Facebook.">
<style>
*{box-sizing:border-box}body{margin:0;background:#050505;color:#fff;font-family:Inter,system-ui;display:flex;justify-content:center;padding:24px}
.card{width:100%;max-width:480px;background:#111;border:1px solid #1e1e1e;border-radius:28px;padding:28px}
h1{margin:0;font-size:42px;font-weight:900;letter-spacing:-2px}h1 small{font-size:12px;color:#666;font-weight:600;margin-left:6px;letter-spacing:0}
.sub{color:#888;margin:10px 0 0;font-size:15px}
input{width:100%;margin-top:24px;padding:18px;border-radius:16px;border:1.5px solid #222;background:#000;color:#fff;font-size:16px;outline:none}
button.main{width:100%;margin-top:14px;padding:18px;border-radius:16px;border:0;background:#fff;color:#000;font-weight:900;font-size:16px;cursor:pointer}
.tag{margin-top:14px;color:#444;font-size:12px}
</style>
</head>
<body>
<div class="card">
<h1>PONTELINKS <small>via Leonardo</small></h1>
<p class="sub">Ponte clicável universal.</p>
<input id="url" placeholder="Cole YouTube, TikTok, Instagram, Facebook, X...">
<button class="main" onclick="gerar()">GERAR PONTE</button>
<div class="tag">Funciona: YouTube • TikTok • Instagram • Facebook • X • Kwai</div>
<div id="res" style="margin-top:20px"></div>
</div>
<script>
function gerar(){
 const v=document.getElementById('url').value.trim();
 if(!v)return;
 const id=Math.random().toString(36).slice(2,8);
 const ponte=`https://pontelinks.com/p/${id}`;
 document.getElementById('res').innerHTML=`<div style="background:#fff;color:#000;padding:18px;border-radius:16px"><b>PONTE CRIADA</b><br><br><div style="font-weight:900;font-size:18px;word-break:break-all">${ponte}</div><button onclick="navigator.clipboard.writeText('${ponte}')" style="margin-top:12px;width:100%;padding:14px;border-radius:12px;background:#000;color:#fff;font-weight:800;border:0">COPIAR PONTE</button></div>`;
}
</script>
</body>
</html>
