<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PONTELINKS - Pontifique seu link para o mundo todo</title>
<meta property="og:title" content="PONTELINKS">
<meta property="og:description" content="Sua ponte universal para o mundo todo">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#060606;display:flex;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.page{width:100%;max-width:430px;min-height:100vh;background:#050505;padding:18px 18px 30px}
.header{display:flex;align-items:center;justify-content:center;gap:12px;padding-top:8px}
.header img{width:56px;height:56px;object-fit:contain}
.header h1{font-family:"Times New Roman",Times,serif;font-size:22px;letter-spacing:3px;font-weight:400;color:#c9b896}
.saiba-top{display:flex;justify-content:center;margin-top:12px}
.saiba-top a{background:transparent;border:1px solid #c9b896;color:#c9b896;border-radius:20px;padding:6px 16px;font-size:13px;font-weight:700;text-decoration:none}
.title{margin-top:22px;text-align:center;color:#fff;font-family:"Times New Roman",serif;font-size:30px;line-height:1.15;font-weight:500}
.input-wrap{margin-top:26px;position:relative}
.input-wrap input{width:100%;height:58px;border-radius:30px;border:none;background:#f0f0f0;padding:0 20px 0 52px;font-size:17px;color:#333;outline:none}
.input-wrap::before{content:"🔗";position:absolute;left:20px;top:50%;transform:translateY(-50%);font-size:20px}
.btn-gerar{margin-top:18px;width:100%;height:54px;border-radius:28px;background:#060606;border:1.6px solid #c9b896;color:#c9b896;font-size:17px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer}
.box-gold{margin-top:20px;background:linear-gradient(180deg,#d6c48a 0%,#b89a4a 100%);border:1.8px dashed #7a642a;border-radius:22px;padding:22px 14px 14px;text-align:center}
.box-gold h2{color:#2a1e00;font-size:18px;line-height:1.2;font-weight:900;word-break:break-all}
.box-actions{margin-top:14px;display:flex;gap:10px;justify-content:center}
.btn-mini{background:#111;color:#fff;border:1px solid #333;border-radius:20px;padding:7px 16px;font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px;cursor:pointer}
.box-white{margin-top:20px;background:#e8e8e8;border-radius:20px;padding:18px 16px;text-align:center;color:#222;font-size:15.5px;line-height:1.35}
.btn{width:100%;height:54px;border-radius:28px;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:12px;cursor:pointer}
.btn-white{background:#fff;border:none;color:#222}
.btn-white-sm{background:#fff;border:none;color:#222;height:48px;font-size:15px;margin-top:8px}
.btn-black{background:#000;border:1.5px solid #c9b896;color:#c9b896;margin-top:14px}
.btn-cloud{margin-top:12px;width:100%;min-height:56px;border-radius:28px;background:#000;border:1.5px solid #c9b896;color:#c9b896;font-size:13px;padding:10px 12px;display:flex;align-items:center;justify-content:center;gap:6px;text-align:center}
.stats-title{margin-top:22px;text-align:center;color:#d0d0d0;font-size:20px;font-weight:800}
.stats{display:flex;gap:12px;margin-top:14px}
.stat{flex:1;background:#e8e8e8;border-radius:22px;padding:18px 10px;text-align:center}
.stat b{font-size:30px;color:#111;display:block}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:99;padding:20px}
#modal .m{background:#fff;border-radius:16px;padding:16px;width:100%;max-width:360px;color:#111}
</style>
</head>
<body>
<div class="page">
  <div class="header">
    <img src="img/logo.png" alt="PONTELINKS">
    <h1>PONTELINKS</h1>
  </div>
  <div class="saiba-top"><a href="saiba-tudo-sobre.html">✨ Saiba tudo a respeito</a></div>
  <div class="title">Pontifique seu link para o<br>mundo todo</div>
  <div class="input-wrap"><input id="linkInput" placeholder="Cole seu link aqui"></div>
  <button class="btn-gerar" onclick="gerar()">✨ GERAR PONTELINKS</button>
  <div class="box-gold">
    <h2 id="resultText">SEU LINK PONTIFICADO VAI APARECER AQUI</h2>
    <div class="box-actions">
      <button class="btn-mini" onclick="copiar()">📋 COPIAR</button>
      <button class="btn-mini" onclick="abrirPrevia()">📄 PRÉVIA</button>
    </div>
  </div>
  <div class="box-white">Mesmo que a sua hospedagem seja sempre gratuita, considere fazer uma contribuição mensal, se estiver ao seu alcance.</div>
  <button class="btn btn-white" onclick="window.open('SEU-LINK-PIX-BR','_blank')">💛 Contribuir via Pix</button>
  <button class="btn btn-white-sm" onclick="window.open('SEU-LINK-INTER-DOLAR','_blank')">💵 Inter - Dólar ($)</button>
  <button class="btn btn-white-sm" onclick="window.open('SEU-LINK-INTER-EURO','_blank')">💶 Inter - Euro (€)</button>
  <button class="btn btn-black" onclick="baixar()">📥 Baixar Aplicativo</button>
  <button class="btn-cloud">🛡️ Cloudflare de Segurança Ativo - Protegido por Cloudflare®</button>
  <div class="stats-title">📊 Estatísticas</div>
  <div class="stats"><div class="stat"><b>1.2k</b>Links</div><div class="stat"><b>8.5k</b>Cliques</div></div>
</div>
<div id="modal" onclick="this.style.display='none'"><div class="m" onclick="event.stopPropagation()"><h3>Prévia da sua Ponte</h3><div id="prevBox" style="border:1px solid #ddd;border-radius:10px;padding:10px;margin-top:10px;word-break:break-all;font-size:13px"></div><button class="btn btn-black" style="margin-top:12px" onclick="document.getElementById('modal').style.display='none'">Fechar</button></div></div>
<script>
let finalLink="";
function gerar(){
  let v=document.getElementById('linkInput').value.trim();
  if(!v){alert('Cole seu link');return}
  if(!v.startsWith('http')) v='https://'+v;
  const id = Math.random().toString(36).substring(2,8) + Math.random().toString(36).substring(2,6);
  finalLink='https://pontelinks.com.br/p/'+id;
  document.getElementById('resultText').innerText=finalLink;
}
function copiar(){
  if(!finalLink){alert('Gere primeiro');return}
  navigator.clipboard.writeText(finalLink);
  document.getElementById('resultText').innerText='✅ COPIADO!';
  setTimeout(()=>{document.getElementById('resultText').innerText=finalLink},1500);
}
function abrirPrevia(){
  if(!finalLink){alert('Gere primeiro');return}
  document.getElementById('prevBox').innerHTML='<b>'+finalLink+'</b><br><br>🖼️ Prévia WhatsApp<br><b>Título do seu link</b><br>Descrição<br><br>📊 Repercussão desta ponte<br>👁️ 12 visualizações<br>🖱️ 8 cliques<br>📍 De onde veio: Facebook, X, Direto/WhatsApp<br><br>💡 Ver mapa completo no App';
  document.getElementById('modal').style.display='flex';
}
function baixar(){alert('Link do App em breve');}
</script>
</body>
</html>
