<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ponte Links</title></head>
<body style="margin:0;background:#000;display:flex;justify-content:center">
<div style="max-width:400px;background:#0E0E0E;min-height:100vh;padding:16px;font-family:sans-serif;text-align:center">
<img src="arvore.jpg" style="width:100%;border-radius:12px">
<h1 style="color:#fff">Pontifique seu link para o mundo todo</h1>
<input id="i" placeholder="Cole seu link" style="width:100%;padding:14px;border-radius:10px;border:1px solid gold;background:#1C1C1C;color:#fff">
<button onclick="document.getElementById('r').innerText='pontelinks.com.br/p/'+Math.random().toString(36).slice(2,7)" style="width:100%;margin-top:10px;padding:14px;background:gold;border:none;border-radius:10px;font-weight:800">GERAR</button>
<p id="r" style="color:#fff;margin-top:10px"></p>
</div></body></html>
