<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prévia PonteLinks</title>
<style>body{margin:0;background:#000;color:#fff;font-family:sans-serif;display:flex;min-height:100vh;align-items:center;justify-content:center;padding:20px;text-align:center}.b{background:#111;border:1px solid #333;border-radius:12px;padding:18px;max-width:420px;width:100%}img{width:100%;border-radius:10px}.g{background:#d4af37;color:#000;padding:14px;border:0;border-radius:10px;width:100%;font-weight:800;margin-top:10px}</style>
<div class="b">
<img src="arvore.jpg">
<h3>PonteLinks - Prévia Segura</h3>
<p id="m">Verificando link...</p>
<p id="d" style="word-break:break-all;color:#d4af37;font-size:12px"></p>
<button id="go" class="g" style="display:none">CONTINUAR PARA DESTINO</button>
<p style="font-size:11px;color:#888;margin-top:10px">Você veio de: <span id="o"></span><br>Cliques: <span id="c"></span></p>
</div>
<script>
let id=location.pathname.split('/p/')[1];
if(!id) id=new URLSearchParams(location.search).get('p');
function bd(s){try{return atob(s.replace(/-/g,'+').replace(/_/g,'/'))}catch(e){return null}}
let url=bd(id);
if(!url){let db=JSON.parse(localStorage.getItem('pl')||'{}');url=db[id]}
if(url){
 let cc=parseInt(localStorage.getItem('c_'+id)||0)+1;
 localStorage.setItem('c_'+id,cc);
 m.innerText='Prévia verificada:';
 d.innerText=url;
 o.innerText=document.referrer||'pontelinks.com / Direto';
 c.innerText=cc;
 go.style.display='block';
 go.onclick=()=>location.href=url;
}else{
 m.innerText='Link não encontrado';
 d.innerText='ID: '+id;
}
</script>
